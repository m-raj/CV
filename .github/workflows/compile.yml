name: Publish CV to Website

on:
  push:
    branches:
      - main  # or your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CV repo
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      # Uses .latexmkrc: build files go to build/, the PDF stays at the top level
      - name: Compile academic CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Mayank_Raj_Academic_CV.tex

      - name: Clone website repo
        run: |
          git clone https://x-access-token:${{ secrets.REPO_ACCESS }}@github.com/m-raj/m-raj.github.io.git

      # The website's /cv/ page embeds /cv.pdf
      - name: Copy PDF to website repo
        run: |
          cp Mayank_Raj_Academic_CV.pdf m-raj.github.io/cv.pdf

      - name: Commit and push changes
        run: |
          cd m-raj.github.io
          git config user.name mraj
          git config user.email mraj@caltech.edu
          git add cv.pdf
          # Skip the commit when the PDF hasn't changed
          git diff --cached --quiet || (git commit -m "Update CV PDF" && git push)
